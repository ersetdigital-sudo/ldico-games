<main class="max-w-4xl mx-auto px-5 py-12">
  <p class="dp text-[var(--lime)] text-sm">Lacak Pesanan</p>
  <h1 class="dp text-4xl sm:text-5xl font-bold mt-2">Pesananmu sampai mana?</h1>
  <p class="text-[var(--mut)] mt-3">Masukkan nomor invoice yang dikirim ke WhatsApp kamu.</p>
  <form id="fm" class="mt-8 flex gap-2"><input id="no" class="inp cut-sm text-lg uppercase min-w-0" placeholder="LDC-XXXXXXXX"><button class="cut-sm dp bg-[var(--lime)] text-black font-bold px-6 sm:px-8">Lacak</button></form>
  <p class="text-xs text-[var(--mut)] mt-3">Coba contoh: <button class="ex text-[var(--lime)] underline">LDC-28819</button> · <button class="ex text-[var(--lime)] underline">LDC-28818</button> · <button class="ex text-[var(--lime)] underline">LDC-28817</button> · <button class="ex text-[var(--lime)] underline">LDC-28816</button></p>
  <div id="res" class="mt-10"></div>
  <div class="mt-14"><div class="dp text-sm mb-4">Riwayat di perangkat ini</div><div id="hist" class="space-y-2"></div></div>
</main><footer class="border-t border-[var(--line)] mt-20"><p class="text-center text-xs text-[var(--mut)] py-8">© 2026 LDICO Games · Butuh bantuan? CS online 24/7</p></footer>
<script src="/assets/data.js"></script>
<script>
const lbl=['Menunggu Pembayaran','Dibayar','Diproses','Sukses'],col=['bg-yellow-400 text-black','bg-[var(--cy)] text-black','bg-[var(--vio)] text-white','bg-[var(--lime)] text-black'];
const row=(a,b,c='')=>`<div class="flex justify-between gap-4"><span class="text-[var(--mut)]">${a}</span><span class="text-right ${c}">${b}</span></div>`;
function show(n){if(!n.trim())return;const v=HIST.get(n);history.replaceState(0,'','/lacak?no='+encodeURIComponent(n.trim().toUpperCase()));
if(!v){res.innerHTML=`<div class="cut bg-[var(--panel)] border border-red-500/50 p-8 text-center"><div class="dp text-xl font-bold">Invoice tidak ditemukan</div><p class="text-sm text-[var(--mut)] mt-2">Cek lagi nomornya, atau hubungi CS 24/7 kami.</p></div>`;return}
const s=S[v.k],it=s.no[v.i],st=v.st||0,[a,b]=s.g.split(','),im=imgOf(v.k);
res.innerHTML=`<div class="cut bg-[var(--panel)] border border-[var(--line)] overflow-hidden">
<div class="p-6 flex flex-col sm:flex-row gap-5 sm:items-center border-b border-[var(--line)] scan"><div class="cut-sm w-16 h-16 bg-cover bg-center shrink-0" style="background-image:${im?`url(${im})`:`linear-gradient(135deg,${a},${b})`}"></div><div class="flex-1"><div class="dp text-xl font-bold">${v.inv}</div><div class="text-sm text-[var(--mut)]">${s.n} · ${it[0]}</div></div><span class="dp text-xs px-3 py-1.5 ${col[st]} h-fit">${lbl[st]}</span></div>
<div class="p-4 sm:p-6"><div class="flex">${STEPS.map((t,i)=>`<div class="flex-1"><div class="flex items-center"><span class="w-8 h-8 grid place-items-center dp text-sm shrink-0 ${i<=st?'bg-[var(--lime)] text-black':'border border-[var(--line)] text-[var(--mut)]'}">${i<=st?'✓':i+1}</span>${i<3?`<span class="flex-1 h-0.5 ${i<st?'bg-[var(--lime)]':'bg-[var(--line)]'}"></span>`:''}</div><div class="text-[10px] sm:text-xs mt-2 pr-1 leading-tight ${i<=st?'':'text-[var(--mut)]'}">${t}</div></div>`).join('')}</div></div>
<div class="grid md:grid-cols-2 border-t border-[var(--line)]"><div class="p-6 space-y-2 text-sm md:border-r border-[var(--line)]">${row('Tanggal',new Date(v.ts).toLocaleString('id-ID'))}${v.f.map(x=>row(x[0],x[1])).join('')}${row('Metode',v.m)}${row('Total',rp(v.total),'dp font-bold')}</div>
<div class="p-6 text-sm">${st==3?(v.token?`<div class="text-xs text-[var(--mut)]">Token listrik</div><div class="dp text-xl font-bold text-[var(--lime)] mt-1">${v.token}</div>`:`<div class="dp text-[var(--lime)] text-lg">Item sudah terkirim ✓</div><p class="text-[var(--mut)] mt-1">Cek akun / nomor tujuan kamu.</p>`):st==0?`<p class="text-[var(--mut)]">Pesanan belum dibayar.</p><a href="/invoice?no=${v.inv}" class="cut-sm dp inline-block mt-4 bg-[var(--lime)] text-black font-bold px-5 py-3">Lanjut Bayar</a>`:`<p class="text-[var(--mut)]">Pesanan sedang diproses, biasanya selesai &lt; 1 menit.</p><button onclick="show('${v.inv}')" class="cut-sm dp mt-4 border border-[var(--line)] px-5 py-3">Refresh</button>`}
<a href="/invoice?no=${v.inv}" class="block text-xs text-[var(--mut)] underline mt-5">Lihat invoice lengkap</a></div></div></div>`}
fm.onsubmit=e=>{e.preventDefault();show(no.value)};
document.querySelectorAll('.ex').forEach(b=>b.onclick=()=>{no.value=b.textContent;show(b.textContent)});
const h=HIST.all();hist.innerHTML=h.length?h.map(x=>`<button class="hi w-full cut-sm bg-[var(--panel)] border border-[var(--line)] hover:border-[var(--lime)] px-4 py-3 flex justify-between text-sm text-left"><span><b class="dp">${x.inv}</b> <span class="text-[var(--mut)]">· ${S[x.k].n}</span></span><span>${rp(x.total)}</span></button>`).join(''):'<p class="text-sm text-[var(--mut)]">Belum ada transaksi di perangkat ini.</p>';
document.querySelectorAll('.hi').forEach((b,i)=>b.onclick=()=>{no.value=h[i].inv;show(h[i].inv)});
if(Q.get('no')){no.value=Q.get('no');show(Q.get('no'))}
</script>

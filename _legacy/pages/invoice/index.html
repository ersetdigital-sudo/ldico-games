<script>
const v=(Q.get('d')&&dec(Q.get('d')))||(Q.get('no')&&HIST.get(Q.get('no')))||SS.get('ldico_inv')||{k:'ml',i:1,f:[['User ID','12345678'],['Zone ID','1234']],inv:Q.get('no')||'LDC-28819001',m:'QRIS',fee:0,disc:0,total:44900,wa:'0812xxxx',ts:Date.now()};
const s=S[v.k],it=s.no[v.i];let st=0;
ino.textContent=v.inv;idate.textContent=new Date(v.ts).toLocaleString('id-ID');im.textContent=v.m;itot.textContent=rp(v.total);
const row=(a,b,c='')=>`<div class="flex justify-between gap-4"><span class="text-[var(--mut)]">${a}</span><span class="text-right ${c}">${b}</span></div>`;
det.innerHTML=row('Layanan',s.n)+row('Item',it[0])+v.f.map(x=>row(x[0],x[1])).join('')+row('WhatsApp',v.wa)+'<div class="border-t border-[var(--line)] my-3"></div>'+row('Harga',rp(it[1]))+row('Biaya',rp(v.fee))+(v.disc?row('Diskon','-'+rp(v.disc),'text-[var(--lime)]'):'')+row('Total',rp(v.total),'dp font-bold');
function qr(seed){let h=seed.split('').reduce((a,c)=>a*31+c.charCodeAt(0)>>>0,7),r='';const N=25;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const fin=(x<7&&y<7)||(x>17&&y<7)||(x<7&&y>17);let on;if(fin){const a=x>17?x-18:x,b=y>17?y-18:y;on=a==0||a==6||b==0||b==6||(a>1&&a<5&&b>1&&b<5)}else{h=(h*1103515245+12345)>>>0;on=(h>>16)&1}if(on)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return `<svg viewBox="-2 -2 29 29" class="w-52 h-52 mx-auto bg-white p-2"><g fill="#07070c">${r}</g></svg>`}
const va=v.m.includes('VA'),retail=['Alfamart','Indomaret'].includes(v.m),code=(va?'8808':'')+v.inv.replace(/\D/g,'').padEnd(12,'7');
payArea.innerHTML=v.m=='QRIS'?qr(v.inv)+'<p class="text-xs text-[var(--mut)] text-center mt-3">Scan pakai m-banking atau e-wallet apa pun</p>'
 :`<div class="cut-sm bg-[var(--bg)] border border-[var(--line)] p-4"><div class="text-xs text-[var(--mut)]">${va?'Nomor Virtual Account':retail?'Kode pembayaran':'Nomor tujuan / link bayar'}</div><div class="flex justify-between items-center mt-1"><span id="code" class="dp text-xl font-bold tracking-wider">${va||retail?code:'Dibuka di aplikasi '+v.m}</span>${va||retail?'<button id="cp" class="text-xs text-[var(--lime)]">Salin</button>':''}</div></div><ol class="text-sm text-[var(--mut)] mt-4 space-y-1 list-decimal pl-5"><li>Buka ${va?'m-banking':retail?'kasir '+v.m:'aplikasi '+v.m}</li><li>${va?'Pilih transfer Virtual Account':retail?'Sebutkan bayar LDICO Games':'Konfirmasi tagihan LDICO'}</li><li>Masukkan / tunjukkan kode di atas</li><li>Bayar sesuai total</li></ol>`;
const cp=document.getElementById('cp');if(cp)cp.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(code);cp.textContent='Tersalin ✓'};
const T=['Pesanan dibuat','Pembayaran diterima','Pesanan diproses','Selesai, item terkirim'];
function draw(){tl.innerHTML=T.map((t,i)=>`<li class="flex gap-3 items-center"><span class="w-6 h-6 grid place-items-center text-xs dp ${i<=st?'bg-[var(--lime)] text-black':'border border-[var(--line)] text-[var(--mut)]'}">${i<=st?'✓':i+1}</span><span class="${i<=st?'':'text-[var(--mut)]'}">${t}</span></li>`).join('')}
draw();document.getElementById('lkp').href='/lacak?no='+v.inv;
const end=v.ts+30*60e3;const t=setInterval(()=>{if(st>0)return;let r=Math.max(0,end-Date.now())/1e3|0;cd.textContent=String(r/60|0).padStart(2,'0')+':'+String(r%60).padStart(2,'0');if(!r){badge.textContent='Kedaluwarsa';badge.className='dp text-xs px-3 py-1.5 bg-red-500 text-white';clearInterval(t)}},1000);
chk.onclick=()=>{chk.textContent='Mengecek...';let i=0;const iv=setInterval(()=>{st=++i;draw();if(i>=3){clearInterval(iv);badge.textContent='Sukses';badge.className='dp text-xs px-3 py-1.5 bg-[var(--lime)] text-black';cd.textContent='Lunas';chk.textContent='Pembayaran Berhasil ✓';chk.disabled=true;HIST.save({...v,st:3})}},700)};
</script>
